<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>PROMPT CAGE</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        color: #cfd6e6;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #screen {
        display: block;
        image-rendering: pixelated;
        touch-action: none;
        cursor: grab;
      }
      #screen:active {
        cursor: grabbing;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        font-size: 12px;
        text-shadow: 0 1px 0 #000;
      }
      #top {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        max-width: 760px;
        width: 100%;
        margin: 0 auto;
      }
      .side {
        flex: 1;
        min-width: 0;
      }
      .side.right {
        text-align: right;
      }
      .name {
        font-weight: 700;
        letter-spacing: 0.08em;
        margin-bottom: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .red .name {
        color: #f0766a;
      }
      .blue .name {
        color: #6fa8f0;
      }
      .bar {
        position: relative;
        height: 12px;
        background: #10131a;
        border: 2px solid #2a3040;
      }
      .bar.thin {
        height: 3px;
        margin-top: 2px;
        border-width: 1px;
      }
      .bar i {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 100%;
      }
      .right .bar i {
        left: auto;
        right: 0;
      }
      .red .hp {
        background: #d8433a;
      }
      .blue .hp {
        background: #3a7bd8;
      }
      /* 白色殘影：扣血後慢慢追上，看得出這一下扣了多少 */
      .lag {
        background: #e9e4d4;
        transition: width 0.5s ease-out 0.25s;
      }
      .poise {
        background: #f2c14e;
      }
      .act {
        margin-top: 4px;
        color: #cfd6e6;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #timer {
        font-size: 22px;
        font-weight: 700;
        color: #f2c14e;
        min-width: 44px;
        text-align: center;
        line-height: 1.5;
      }
      #mid {
        text-align: center;
        margin-top: 6px;
      }
      #banner {
        font-size: clamp(34px, 9vw, 72px);
        font-weight: 800;
        letter-spacing: 0.06em;
        color: #fff;
        text-shadow:
          0 4px 0 #000,
          0 0 18px rgba(0, 0, 0, 0.6);
        min-height: 1.2em;
      }
      #banner.gold {
        color: #f2c14e;
      }
      #banner.small {
        font-size: clamp(18px, 4.5vw, 30px);
        color: #5ef2ff;
      }
      #banner.pop {
        animation: pop 0.18s ease-out;
      }
      @keyframes pop {
        from {
          transform: scale(1.7);
          opacity: 0.2;
        }
      }
      #result {
        font-size: 16px;
        font-weight: 700;
        min-height: 1.4em;
      }
      #bottom {
        margin-top: auto;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
      }
      #help,
      #stats {
        color: #7f8aa3;
        line-height: 1.6;
      }
      #btns {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      button {
        pointer-events: auto;
        font: inherit;
        font-weight: 700;
        color: #cfd6e6;
        background: #242b3a;
        border: 0;
        border-bottom: 3px solid #10131a;
        padding: 9px 12px;
        cursor: pointer;
        touch-action: manipulation;
        white-space: nowrap;
      }
      button.primary {
        color: #0b0d14;
        background: #f2c14e;
        border-bottom-color: #a37a1c;
      }
      button:active {
        transform: translateY(2px);
        border-bottom-width: 1px;
      }
      #start {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: rgba(5, 6, 10, 0.55);
      }
      #start.hidden {
        display: none;
      }
      #start h1 {
        margin: 0;
        font-size: clamp(30px, 8vw, 60px);
        letter-spacing: 0.14em;
        color: #f2c14e;
        text-shadow: 0 4px 0 #000;
      }
      #start p {
        margin: 0;
        color: #7f8aa3;
        font-size: 13px;
      }
      #startBtn {
        font-size: 18px;
        padding: 14px 28px;
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div id="hud">
      <div id="top">
        <div class="side red">
          <div class="name" id="n0"></div>
          <div class="bar"><i class="lag" id="lag0"></i><i class="hp" id="hp0"></i></div>
          <div class="bar thin"><i class="poise" id="po0"></i></div>
          <div class="act" id="act0"></div>
        </div>
        <div id="timer">60</div>
        <div class="side blue right">
          <div class="name" id="n1"></div>
          <div class="bar"><i class="lag" id="lag1"></i><i class="hp" id="hp1"></i></div>
          <div class="bar thin"><i class="poise" id="po1"></i></div>
          <div class="act" id="act1"></div>
        </div>
      </div>
      <div id="mid">
        <div id="banner"></div>
        <div id="result"></div>
      </div>
      <div id="bottom">
        <div>
          <div id="help">拖曳：旋轉／俯仰　滾輪・雙指：縮放</div>
          <div id="stats"></div>
        </div>
        <div id="btns">
          <button id="mute">音效：開</button>
          <button id="replay">重播這一場</button>
          <button id="next" class="primary">下一場</button>
        </div>
      </div>
    </div>
    <div id="start">
      <h1>PROMPT CAGE</h1>
      <p>P1 · 戰鬥核心測試（兩台寫死的 AI 互打）</p>
      <button id="startBtn" class="primary">開始對戰</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
