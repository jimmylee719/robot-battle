<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>PROMPT CAGE</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        color: #cfd6e6;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #screen {
        display: block;
        image-rendering: pixelated;
        touch-action: none;
        cursor: grab;
      }
      #screen:active {
        cursor: grabbing;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        font-size: 12px;
        text-shadow: 0 1px 0 #000;
      }
      #top {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        max-width: 760px;
        width: 100%;
        margin: 0 auto;
      }
      .side {
        flex: 1;
        min-width: 0;
      }
      .side.right {
        text-align: right;
      }
      .name {
        font-weight: 700;
        letter-spacing: 0.08em;
        margin-bottom: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .red .name {
        color: #f0766a;
      }
      .blue .name {
        color: #6fa8f0;
      }
      .bar {
        position: relative;
        height: 12px;
        background: #10131a;
        border: 2px solid #2a3040;
      }
      .bar.thin {
        height: 3px;
        margin-top: 2px;
        border-width: 1px;
      }
      .bar i {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 100%;
      }
      .right .bar i {
        left: auto;
        right: 0;
      }
      .red .hp {
        background: #d8433a;
      }
      .blue .hp {
        background: #3a7bd8;
      }
      /* 白色殘影：扣血後慢慢追上，看得出這一下扣了多少 */
      .lag {
        background: #e9e4d4;
        transition: width 0.5s ease-out 0.25s;
      }
      .poise {
        background: #f2c14e;
      }
      .act {
        margin-top: 4px;
        color: #cfd6e6;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #timer {
        font-size: 22px;
        font-weight: 700;
        color: #f2c14e;
        min-width: 44px;
        text-align: center;
        line-height: 1.5;
      }
      #mid {
        text-align: center;
        margin-top: 6px;
      }
      #banner {
        font-size: clamp(34px, 9vw, 72px);
        font-weight: 800;
        letter-spacing: 0.06em;
        color: #fff;
        text-shadow:
          0 4px 0 #000,
          0 0 18px rgba(0, 0, 0, 0.6);
        min-height: 1.2em;
      }
      #banner.gold {
        color: #f2c14e;
      }
      #banner.small {
        font-size: clamp(18px, 4.5vw, 30px);
        color: #5ef2ff;
      }
      #banner.pop {
        animation: pop 0.18s ease-out;
      }
      @keyframes pop {
        from {
          transform: scale(1.7);
          opacity: 0.2;
        }
      }
      #bottom {
        margin-top: auto;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
      }
      #left {
        min-width: 0;
        max-width: min(46%, 380px);
      }
      #stats {
        color: #7f8aa3;
        line-height: 1.6;
        margin-top: 6px;
      }
      #btns {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      button {
        pointer-events: auto;
        font: inherit;
        font-weight: 700;
        color: #cfd6e6;
        background: #242b3a;
        border: 0;
        border-bottom: 3px solid #10131a;
        padding: 9px 12px;
        cursor: pointer;
        touch-action: manipulation;
        white-space: nowrap;
      }
      button.primary {
        color: #0b0d14;
        background: #f2c14e;
        border-bottom-color: #a37a1c;
      }
      button:active {
        transform: translateY(2px);
        border-bottom-width: 1px;
      }
      .hidden {
        display: none !important;
      }

      /* 指令清單：原文 → 機器人的理解 */
      #rules {
        background: rgba(11, 13, 20, 0.82);
        border-left: 3px solid #d8433a;
        padding: 8px 10px;
        text-shadow: none;
      }
      .ptitle {
        color: #7f8aa3;
        margin-bottom: 6px;
      }
      .rule {
        padding: 3px 6px;
        margin: 0 -6px;
        border-left: 3px solid transparent;
        opacity: 0.6;
        line-height: 1.45;
      }
      .rule .src {
        color: #cfd6e6;
      }
      .rule .und {
        color: #8fd0a0;
      }
      .rule.bad .und {
        color: #f2c14e;
      }
      .rule .note {
        color: #7f8aa3;
      }
      .rule.ignored {
        opacity: 0.45;
      }
      .rule.ignored .src {
        text-decoration: line-through;
      }
      .rule.fallback .und {
        color: #7f8aa3;
      }
      .rule.active {
        opacity: 1;
        background: rgba(242, 193, 78, 0.14);
        border-left-color: #f2c14e;
      }

      /* 賽前設定、賽後解讀：蓋在畫面上的面板 */
      .overlay {
        position: fixed;
        inset: 0;
        overflow-y: auto;
        background: rgba(5, 6, 10, 0.78);
        display: flex;
        padding: 16px 12px;
        box-sizing: border-box;
        font-size: 13px;
      }
      .panel {
        margin: auto;
        width: 100%;
        max-width: 620px;
        background: #0f121d;
        border: 2px solid #2a3040;
        padding: 18px;
        box-sizing: border-box;
      }
      .panel h1 {
        margin: 0 0 2px;
        font-size: clamp(24px, 6vw, 38px);
        letter-spacing: 0.14em;
        color: #f2c14e;
      }
      .panel .sub {
        color: #7f8aa3;
        margin-bottom: 16px;
      }
      .panel h2 {
        margin: 14px 0 6px;
        font-size: 13px;
        color: #7f8aa3;
        font-weight: 400;
      }
      #tiers {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .tier {
        white-space: normal;
        text-align: left;
        padding: 10px;
        border: 2px solid #2a3040;
        border-bottom-width: 2px;
        background: #151929;
      }
      .tier b {
        display: block;
        font-size: 15px;
        color: #cfd6e6;
      }
      .tier span {
        display: block;
        font-weight: 400;
        color: #7f8aa3;
        margin-top: 3px;
        line-height: 1.4;
      }
      .tier.on {
        border-color: #f2c14e;
        background: #2a2618;
      }
      .tier.on b {
        color: #f2c14e;
      }
      #prompt {
        display: block;
        width: 100%;
        box-sizing: border-box;
        height: 92px;
        resize: none;
        font: inherit;
        font-size: 16px;
        line-height: 1.5;
        color: #fff;
        background: #05060a;
        border: 2px solid #2a3040;
        padding: 10px;
        outline: none;
        -webkit-user-select: text;
        user-select: text;
      }
      #prompt:focus {
        border-color: #f2c14e;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 6px;
        flex-wrap: wrap;
      }
      #examples {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip {
        padding: 5px 9px;
        font-weight: 400;
        border-bottom-width: 2px;
      }
      #count {
        color: #7f8aa3;
      }
      .foe {
        color: #6fa8f0;
        line-height: 1.6;
      }
      .foe span {
        color: #7f8aa3;
      }
      #startBtn {
        width: 100%;
        margin-top: 16px;
        font-size: 18px;
        padding: 14px;
      }
      #resultTitle {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.1em;
        margin-bottom: 10px;
      }
      #resultTitle.win {
        color: #f2c14e;
      }
      #resultTitle.lose {
        color: #7f8aa3;
      }
      #resultCols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      @media (max-width: 560px) {
        #resultCols {
          grid-template-columns: 1fr;
        }
        #left {
          max-width: 62%;
        }
      }
      .col .name {
        margin-bottom: 4px;
      }
      .col .prompt {
        background: #05060a;
        border: 1px solid #2a3040;
        padding: 8px;
        line-height: 1.5;
        margin-bottom: 8px;
        color: #fff;
      }
      .col .rule {
        opacity: 1;
      }
      .col .rule.ignored {
        opacity: 0.5;
      }
      .col .rule.fallback {
        display: none;
      }
      #resultBtns {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      #resultBtns button {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div id="hud">
      <div id="top">
        <div class="side red">
          <div class="name" id="n0"></div>
          <div class="bar"><i class="lag" id="lag0"></i><i class="hp" id="hp0"></i></div>
          <div class="bar thin"><i class="poise" id="po0"></i></div>
          <div class="act" id="act0"></div>
        </div>
        <div id="timer">60</div>
        <div class="side blue right">
          <div class="name" id="n1"></div>
          <div class="bar"><i class="lag" id="lag1"></i><i class="hp" id="hp1"></i></div>
          <div class="bar thin"><i class="poise" id="po1"></i></div>
          <div class="act" id="act1"></div>
        </div>
      </div>
      <div id="mid">
        <div id="banner"></div>
      </div>
      <div id="bottom">
        <div id="left">
          <div id="rules" class="hidden"></div>
          <div id="stats"></div>
        </div>
        <div id="btns">
          <button id="mute">音效：開</button>
          <button id="speed">速度 ×1</button>
          <button id="edit">修改指令</button>
        </div>
      </div>
    </div>

    <div id="setup" class="overlay">
      <div class="panel">
        <h1>PROMPT CAGE</h1>
        <div class="sub">你不能操控機器人。你只能在開打前告訴它該怎麼打。</div>

        <h2>1 · 選 AI 模型</h2>
        <div id="tiers"></div>

        <h2>2 · 寫戰術指令</h2>
        <textarea id="prompt" spellcheck="false" placeholder="例如：先繞圈保持距離，對手血量低於 30% 時衝刺連打"></textarea>
        <div class="row">
          <div id="examples"></div>
          <div id="count"></div>
        </div>

        <h2>對手</h2>
        <div class="foe">GHOST-02 游擊者 · Pro<br /><span>它的指令打完才看得到。</span></div>

        <button id="startBtn" class="primary">開打</button>
      </div>
    </div>

    <div id="result" class="overlay hidden">
      <div class="panel">
        <div id="resultTitle"></div>
        <div id="resultCols"></div>
        <div id="resultBtns">
          <button id="again">重播這一場</button>
          <button id="reroll">同指令再打一場</button>
          <button id="back" class="primary">修改指令</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
